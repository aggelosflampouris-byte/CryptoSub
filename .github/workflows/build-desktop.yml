name: Build & Publish Desktop App (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows Installer

    steps:
      # ── 1. Source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Rust ────────────────────────────────────────────────────
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      # ── 5. Stamp version ────────────────────────────────────────────
      - name: Stamp desktop version with run number
        shell: bash
        run: |
          BUILD=${{ github.run_number }}
          VERSION="0.1.${BUILD}"
          # Patch package.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n');"
          # Patch tauri.conf.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('desktop/src-tauri/tauri.conf.json','utf8'));c.version='${VERSION}';fs.writeFileSync('desktop/src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"
          # Write version-desktop.json and legacy version.json
          echo "{\"version\":\"${VERSION}\",\"build\":${BUILD}}" > version-desktop.json
          echo "{\"version\":\"${VERSION}\",\"build\":${BUILD}}" > version.json

      # ── 6. Frontend ────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      # ── 6. Tauri Build + Rolling Release ───────────────────────────
      - name: Clean up old release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all assets from the 'latest' release and delete old EXEs, MSIs, and ZIPs
          gh release view latest --repo ${{ github.repository }} --json assets -q ".assets[].name" | grep -E "^CryptoSub_.*\.(exe|msi|zip)$" | while read -r asset; do
            echo "Deleting old asset: $asset"
            gh release delete-asset latest "$asset" --repo ${{ github.repository }} -y || true
          done || echo "No old assets found or release 'latest' doesn't exist yet."

      - name: Build Tauri Windows installer & publish to rolling "latest" release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: latest
          releaseName: 'CryptoSub — Latest Build'
          releaseBody: |
            ## 📥 CryptoSub — Latest Build

            This release is **automatically updated** on every push to `main`.
            Always download from here for the most recent version.

            ---

            ### 🪟 Windows Installation
            1. Download **`CryptoSub_x.x.x_x64-setup.exe`** below.
            2. Run the installer — it will install CryptoSub and create a Start Menu shortcut.
            3. On first launch, Windows SmartScreen may warn about an unknown publisher.
               Click **"More info → Run anyway"** to proceed.

            ---
            > macOS and Linux builds coming soon.
          releaseDraft: false
          releasePrerelease: false
          prerelease: false

      - name: Upload version-desktop.json and legacy version.json to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "version-desktop.json,version.json"
          tag: "latest"
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
