name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper (Version 8.4)
      run: cd android && gradle wrapper --gradle-version 8.4

    - name: Stamp versionCode with GitHub run number
      run: |
        sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" android/app/build.gradle.kts
        sed -i 's/versionName = "0.1.0"/versionName = "0.1.${{ github.run_number }}"/g' android/app/build.gradle.kts

    - name: Cache Debug Keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: debug-keystore-${{ runner.os }}

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Write version-android.json and legacy version.json
      run: |
        echo '{"version":"0.1.${{ github.run_number }}","build":${{ github.run_number }}}' > version-android.json
        echo '{"version":"0.1.99999","build":99999}' > version.json

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivateMessenger-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/debug/app-debug.apk,version-android.json,version.json"
        tag: "latest"
        name: "CryptoSub — Latest Build"
        makeLatest: true
        allowUpdates: true
        replacesArtifacts: true
        omitBodyDuringUpdate: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
