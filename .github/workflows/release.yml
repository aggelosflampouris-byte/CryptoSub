name: CI/CD Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Stamp versions
        run: |
          BUILD_NUM=$((${{ github.run_number }} + 200))
          sed -i "s/versionCode = 1/versionCode = $BUILD_NUM/" android/app/build.gradle.kts
          sed -i "s/versionName = \"0.1.0\"/versionName = \"0.1.$BUILD_NUM\"/g" android/app/build.gradle.kts


      - name: Build Debug APK
        run: cd android && gradle wrapper --gradle-version 8.4 && ./gradlew assembleDebug --stacktrace

      - name: Write version JSONs
        run: |
          BUILD_NUM=$((${{ github.run_number }} + 200))
          echo "{\"version\":\"0.1.$BUILD_NUM\",\"build\":$BUILD_NUM}" > version-android.json
          echo '{"version":"0.1.99999","build":99999}' > version.json

      - name: Move APK to root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk .

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app-debug.apk
            version-android.json

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Stamp desktop version
        shell: bash
        run: |
          BUILD=$((${{ github.run_number }} + 200))
          VERSION="0.1.${BUILD}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version='${VERSION}';fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('desktop/src-tauri/tauri.conf.json','utf8'));c.version='${VERSION}';fs.writeFileSync('desktop/src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n');"
          echo "{\"version\":\"${VERSION}\",\"build\":${BUILD}}" > version-desktop.json

      - name: Install npm dependencies
        working-directory: desktop
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop

      - name: Move Desktop Binaries to root
        shell: bash
        run: |
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe ./CryptoSub-Windows-setup.exe || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            *.exe
            version-desktop.json

  publish-release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          tag: "latest"
          name: "CryptoSub — Latest Release"
          body: |
            ## 📥 CryptoSub — Latest Builds

            This release is **automatically updated** on every push to the repository.
            Always download from here for the most recent version of CryptoSub!

            ---

            ### 📱 Android
            1. Download **`app-debug.apk`** below.
            2. Open it on your Android device to install (you may need to allow "Install unknown apps").
            3. *Updates automatically in the background.*

            ### 🪟 Windows
            1. Download **`CryptoSub-Windows-setup.exe`** below.
            2. Run the installer — it will install CryptoSub and create a Start Menu shortcut.
            3. *Updates automatically in the background.*
            > On first launch, Windows SmartScreen may warn about an unknown publisher. Click **"More info → Run anyway"**.
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
